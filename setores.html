<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setores Ordenados</title>

<!-- SDK Oficial do Supabase e Proteção de Acesso -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://rdxklpkukmuwwetftqde.supabase.co';
    const SUPABASE_ANON_KEY = 'SUA_CHAVE_API_COPIADA_AQUI'; // Substitua pela sua chave anon public

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function contaAprovada(userId) {
        const { data, error } = await _supabase
            .from('perfis')
            .select('aprovado')
            .eq('id', userId)
            .maybeSingle();
        if (error) return false;
        return data ? data.aprovado === true : false;
    }

    (async function protegerPagina() {
        const { data: { session } } = await _supabase.auth.getSession();
        
        if (!session) {
            window.location.replace('index.html');
            return;
        }

        const aprovado = await contaAprovada(session.user.id);
        if (!aprovado) {
            await _supabase.auth.signOut();
            window.location.replace('index.html');
        }
    })();
</script>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mut:#667085;--head:#1c4587;--headink:#fff;--line:#d9dde5;--zebra:#eef0f3;--done:#a8c9ec;--accent:#1c4587}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1a202b;--ink:#e6e9ef;--mut:#99a2b3;--head:#16356b;--line:#2c3547;--zebra:#202838;--done:#27476f;--accent:#7aa7e6}}
:root[data-theme="dark"]{--bg:#12161d;--card:#1a202b;--ink:#e6e9ef;--mut:#99a2b3;--head:#16356b;--line:#2c3547;--zebra:#202838;--done:#27476f;--accent:#7aa7e6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Georgia,"Times New Roman",serif}
header{padding:20px 20px 8px}
h1{margin:0;font-size:24px}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 20px 14px;align-items:center}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button{cursor:pointer}
button.p{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#q{flex:1 1 220px;min-width:160px}
.stats{margin-left:auto;color:var(--mut);font-size:14px}
.wrap{margin:0 20px 40px;overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:1100px}
th{background:var(--head);color:var(--headink);padding:10px 8px;text-align:center;position:sticky;top:0;white-space:nowrap}
td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr.done{background:var(--done)}
tbody tr.done td:not(.chk):not(.act){text-decoration:line-through;opacity:.85}
td[contenteditable]:focus{outline:2px solid var(--accent);background:var(--card);text-decoration:none}
.chk input{width:18px;height:18px;padding:0}
.act button{padding:2px 8px;color:var(--mut)}
body.ro .act{display:none}
.empty{padding:30px;text-align:center;color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
.grid .full{grid-column:1/-1}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Setores Ordenados</h1>
  <div class="sub" id="sync">Conectando à planilha…</div>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Buscar setor, bairro, e-mail, endereço…" aria-label="Buscar">
  <select id="fb" aria-label="Filtrar por bairro"><option value="">Todos os bairros</option></select>
  <select id="fs" aria-label="Filtrar por status"><option value="">Todos</option><option value="p">Pendentes</option><option value="d">Concluídos</option></select>
  <button class="p" id="add">Adicionar setor</button>
  <button id="imp">Importar CSV</button>
  <button id="rf">Atualizar da planilha</button>
  <button id="exp">Exportar CSV</button>
  <span class="stats" id="st"></span>
</div>
<div class="wrap"><table>
<thead><tr><th>Setor</th><th>EUV</th><th>EDOC</th><th>Tipo</th><th>Bairro</th><th>Status</th><th>Telefone</th><th>Tem whatsapp?</th><th>Telefone 2</th><th>Tem whatsapp? 2</th><th>E-mail</th><th>Endereço</th><th class="act"></th></tr></thead>
<tbody id="tb"></tbody></table><div class="empty" id="em" hidden>Nenhum setor encontrado. Use “Adicionar setor” ou “Importar CSV”.</div></div>

<dialog id="dlg"><form method="dialog" id="fm">
<div class="grid">
<label>Setor<input name="setor" required></label><label>Bairro<input name="bairro" list="bl"></label>
<label>EUV<input name="euv" type="number" value="0"></label><label>EDOC<input name="edoc" type="number" value="0"></label>
<label>Tipo<input name="tipo" value="0"></label><label>Telefone<input name="tel"></label>
<label>Tem whatsapp?<select name="w1"><option></option><option>Sim</option><option>Não</option><option>Não se aplica.</option></select></label>
<label>Telefone 2<input name="tel2"></label>
<label>Tem whatsapp? 2<select name="w2"><option></option><option>Sim</option><option>Não</option><option>Não se aplica.</option></select></label>
<label>E-mail<input name="email" type="email"></label>
<label class="full">Endereço<input name="end"></label>
</div>
<datalist id="bl"></datalist>
<div class="row"><button type="button" id="cn">Cancelar</button><button class="p" type="submit">Salvar setor</button></div>
</form></dialog>
<input type="file" id="file" accept=".csv,text/csv" hidden>

<script>
const K=["setor","euv","edoc","tipo","bairro","ok","tel","w1","tel2","w2","email","end"];
const H=["Setor","EUV","EDOC","Tipo","Bairro","Status","Telefone","Tem whatsapp?","Telefone 2","Tem whatsapp? 2","E-mail","Endereço"];
const mk=(s,e,d,b,ok,c)=>Object.assign({setor:s,euv:e,edoc:d,tipo:"0",bairro:b,ok:!!ok,tel:"",w1:"",tel2:"",w2:"",email:"",end:""},c||{});
const ct={tel:"(21) 3495-0958",w1:"Sim",tel2:"Não se aplica.",w2:"Não se aplica.",email:"millenioilhapura.adm@gmail.com",end:"Av. Abraham Medina, 355"};
const BO="Barra Olímpica";
const seed=[["330455705211735",344,116,1],["330455705211693",136,25],["330455705211694",136,103],["330455705211699",68,58],["330455705211698",68,51],["330455705211697",68,25],["330455705211696",136,110],["330455705211738",272,206],["330455705211695",136,98],["330455705211737",135,109,1,1],["330455705211747",136,101,1,1],["330455705211746",136,0,1,1],["330455705211739",136,0],["330455705211745",136,0],["330455705211744",136,0],["330455705211749",136,0]]
 .map(r=>mk(r[0],r[1],r[2],BO,r[3],r[4]?ct:null));
// ===== CONFIGURAÇÃO =====
const SHEET_ID="1Bu5hq9aRMeWh-4bk9-34QZ0InyrtitQEved6-iEQ7Dc",GID="1534942531";
const SCRIPT_URL=""; // cole aqui a URL do Apps Script (veja setores-apps-script.gs) para gravar na planilha
const EDIT=!!SCRIPT_URL;
let data=[];
try{const s=localStorage.getItem("setores_v1");data=s?JSON.parse(s):seed}catch(e){data=seed}
let local={};try{local=JSON.parse(localStorage.getItem("status_local")||"{}")}catch(e){}
const $=id=>document.getElementById(id);
async function load(){
 $("st").textContent="Carregando da planilha…";
 try{
  const r=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`);
  if(!r.ok)throw 0;
  const rows=parseCSV(await r.text()).filter(r=>r.some(x=>x.trim()));
  const idx=K.map((k,i)=>rows[0].findIndex(h=>h.trim().toLowerCase()===H[i].toLowerCase()));
  if(idx[0]<0)throw 0;
  data=rows.slice(1).map(r=>{const o={};K.forEach((k,i)=>{const v=idx[i]>=0?(r[idx[i]]||"").trim():"";o[k]=k==="ok"?/^(sim|true|1|x)$/i.test(v):v});
   if(!EDIT&&o.setor in local)o.ok=local[o.setor];return o}).filter(o=>o.setor);
  save();bairros();render();
  $("sync").textContent="Planilha lida às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
 }catch(e){bairros();render();$("sync").textContent="Não foi possível ler a planilha (mostrando os dados salvos). Ela precisa estar compartilhada como “Qualquer pessoa com o link”."}
}
function push(op,d,k){if(!EDIT)return;
 fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({op,gid:GID,setor:d.setor,k,v:k?d[k]:null,row:d})}).catch(()=>{})}
function save(){try{localStorage.setItem("setores_v1",JSON.stringify(data))}catch(e){}}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function bairros(){const b=[...new Set(data.map(d=>d.bairro).filter(Boolean))].sort();const cur=$("fb").value;
 $("fb").innerHTML='<option value="">Todos os bairros</option>'+b.map(x=>`<option${x===cur?" selected":""}>${esc(x)}</option>`).join("");
 $("bl").innerHTML=b.map(x=>`<option value="${esc(x)}">`).join("")}
function render(){
 const q=$("q").value.toLowerCase(),fb=$("fb").value,fs=$("fs").value;
 const rows=data.map((d,i)=>[d,i]).filter(([d])=>(!q||K.some(k=>k!=="ok"&&String(d[k]).toLowerCase().includes(q)))&&(!fb||d.bairro===fb)&&(!fs||(fs==="d")===d.ok));
 $("tb").innerHTML=rows.map(([d,i])=>`<tr class="${d.ok?"done":""}" data-i="${i}">`+K.map(k=>k==="ok"?`<td class="chk"><input type="checkbox" ${d.ok?"checked":""} aria-label="Concluído"></td>`:`<td ${EDIT?'contenteditable="plaintext-only"':""} data-k="${k}">${esc(d[k])}</td>`).join("")+`<td class="act"><button title="Excluir setor" aria-label="Excluir">✕</button></td></tr>`).join("");
 $("em").hidden=rows.length>0;
 const done=data.filter(d=>d.ok).length;
 $("st").textContent=`${data.length} setores · ${done} concluídos · ${data.length-done} pendentes`;
}
$("tb").addEventListener("change",e=>{if(e.target.type!=="checkbox")return;const tr=e.target.closest("tr");const d=data[tr.dataset.i];d.ok=e.target.checked;save();
 if(EDIT)push("set",d,"ok");else{local[d.setor]=d.ok;try{localStorage.setItem("status_local",JSON.stringify(local))}catch(x){}}render()});
$("tb").addEventListener("focusout",e=>{const td=e.target.closest("td[data-k]");if(!td)return;const d=data[td.parentNode.dataset.i],k=td.dataset.k,v=td.textContent.trim();
 if(d[k]!==v){d[k]=v;save();push("set",d,k);if(k==="bairro")bairros()}});
$("tb").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.k){e.preventDefault();e.target.blur()}});
$("tb").addEventListener("click",e=>{const b=e.target.closest(".act button");if(!b)return;const i=b.closest("tr").dataset.i;
 if(confirm("Excluir o setor "+data[i].setor+"?")){push("del",data[i]);data.splice(i,1);save();bairros();render()}});
["q","fb","fs"].forEach(id=>$(id).addEventListener("input",render));
$("add").onclick=()=>{$("fm").reset();$("dlg").showModal()};
$("cn").onclick=()=>$("dlg").close();
$("fm").addEventListener("submit",()=>{const f=new FormData($("fm"));
 data.push({setor:f.get("setor").trim(),euv:f.get("euv"),edoc:f.get("edoc"),tipo:f.get("tipo"),bairro:f.get("bairro").trim(),ok:false,tel:f.get("tel"),w1:f.get("w1"),tel2:f.get("tel2"),w2:f.get("w2"),email:f.get("email"),end:f.get("end")});
 push("add",data[data.length-1]);save();bairros();render()});
function csvLine(a){return a.map(v=>{v=String(v??"");return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(";")}
$("exp").onclick=()=>{const t="\ufeff"+[csvLine(H)].concat(data.map(d=>csvLine(K.map(k=>k==="ok"?(d.ok?"Sim":"Não"):d[k])))).join("\n");
 try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.download="setores.csv";a.click()}catch(e){alert("Não foi possível baixar o arquivo neste ambiente.")}};
function parseCSV(t){const sep=(t.split("\n")[0].match(/;/g)||[]).length>=(t.split("\n")[0].match(/,/g)||[]).length?";":",";
 const out=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'&&t[i+1]==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}
  else if(ch==='"')q=true;else if(ch===sep){r.push(c);c=""}else if(ch==="\n"){r.push(c);out.push(r);r=[];c=""}else if(ch!=="\r")c+=ch}
 if(c||r.length){r.push(c);out.push(r)}return out}
$("imp").onclick=()=>$("file").click();
$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;const rows=parseCSV((await f.text()).replace(/^\ufeff/,"")).filter(r=>r.some(x=>x.trim()));
 if(rows.length<2){alert("Arquivo sem dados.");return}
 const idx=K.map((k,i)=>rows[0].findIndex(h=>h.trim().toLowerCase()===H[i].toLowerCase()));
 let add=0,upd=0;rows.slice(1).forEach(r=>{const o={};K.forEach((k,i)=>{const v=idx[i]>=0?(r[idx[i]]||"").trim():"";o[k]=k==="ok"?/^(sim|true|1|x)$/i.test(v):v});
  if(!o.setor)return;const ex=data.find(d=>d.setor===o.setor);
  if(ex){K.forEach((k,i)=>{if(idx[i]>=0)ex[k]=o[k]});upd++}else{data.push(o);add++}});
 save();bairros();render();alert(`${add} setores adicionados, ${upd} atualizados.`);e.target.value=""};
if(!EDIT){$("add").hidden=$("imp").hidden=true;document.body.classList.add("ro")}
$("rf").onclick=load;load();setInterval(()=>{if(!document.activeElement.isContentEditable)load()},120000);
</script>
</body>
</html>
