<!-- SDK Oficial do Supabase e Proteção de Acesso -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://rdxklpkukmuwwetftqde.supabase.co';
    const SUPABASE_ANON_KEY = 'SUA_CHAVE_API_COPIADA_AQUI'; // Substitua pela sua chave anon public

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function contaAprovada(userId) {
        const { data, error } = await _supabase
            .from('perfis')
            .select('aprovado')
            .eq('id', userId)
            .maybeSingle();
        if (error) return false;
        return data ? data.aprovado === true : false;
    }

    (async function protegerPagina() {
        const { data: { session } } = await _supabase.auth.getSession();
        
        if (!session) {
            window.location.replace('index.html');
            return;
        }

        const aprovado = await contaAprovada(session.user.id);
        if (!aprovado) {
            await _supabase.auth.signOut();
            window.location.replace('index.html');
        }
    })();
</script>

<script>
const K=["setor","euv","edoc","tipo","bairro","ok","apm","tel","w1","tel2","w2","email","end","obs"];
const H=["Setor","EUV","EDOC","Tipo","Bairro","Status","APM","Telefone","Tem whatsapp?","Telefone 2","Tem whatsapp? 2","E-mail","Endereço","Observações"];
const ML=["tel","tel2","email","obs"];
const mk=(s,e,d,b,ok,c)=>Object.assign({setor:s,euv:e,edoc:d,tipo:"0",bairro:b,ok:!!ok,tel:"",w1:"",tel2:"",w2:"",email:"",end:"",apm:"",obs:""},c||{});
const ct={tel:"(21) 3495-0958",w1:"Sim",tel2:"Não se aplica.",w2:"Não se aplica.",email:"millenioilhapura.adm@gmail.com",end:"Av. Abraham Medina, 355"};
const BO="Barra Olímpica";
const seed=[["330455705211735",344,116,1],["330455705211693",136,25],["330455705211694",136,103],["330455705211699",68,58],["330455705211698",68,51],["330455705211697",68,25],["330455705211696",136,110],["330455705211738",272,206],["330455705211695",136,98],["330455705211737",135,109,1,1],["330455705211747",136,101,1,1],["330455705211746",136,0,1,1],["330455705211739",136,0],["330455705211745",136,0],["330455705211744",136,0],["330455705211749",136,0]]
 .map(r=>mk(r[0],r[1],r[2],BO,r[3],r[4]?ct:null));
// ===== CONFIGURAÇÃO =====
const SHEET_ID="1Bu5hq9aRMeWh-4bk9-34QZ0InyrtitQEved6-iEQ7Dc",GID="1534942531";
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbzBlQDBqJkdd09QhfsKCqYM2NlSqj9qKN0EO6vmq5mmvwhaxqVyH186fpBvduWmue8/exec"; // cole aqui a URL do Apps Script (veja setores-apps-script.gs) para gravar na planilha
const EDIT=!!SCRIPT_URL;
let data=[];
try{const s=localStorage.getItem("setores_v1");data=s?JSON.parse(s):seed}catch(e){data=seed}
let local={};try{local=JSON.parse(localStorage.getItem("status_local")||"{}")}catch(e){}
const $=id=>document.getElementById(id);
const hora=()=>new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
let hold=0,pend=0,fail=0;const U=[];
$("hr").innerHTML=H.map(h=>`<th>${h}</th>`).join("")+'<th class="act"></th>';
function fmtTel(l){if(!/^[\d\s().+-]+$/.test(l))return l;let n=l.replace(/\D/g,"");if((n.length===12||n.length===13)&&n.startsWith("55"))n=n.slice(2);
 return n.length===11?`(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`:n.length===10?`(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}`:l}
function norm(k,v){v=String(v??"").replace(/\r/g,"");
 if(k==="tel"||k==="tel2")return v.split(/[\n;,\/]+/).map(x=>fmtTel(x.trim())).filter(Boolean).join("\n");
 if(k==="email")return v.split(/[\n;,\s]+/).map(x=>x.trim()).filter(Boolean).join("\n");
 return v.trim()}
const fix=o=>{K.forEach(k=>{if(o[k]==null)o[k]=k==="ok"?false:""});ML.forEach(k=>o[k]=norm(k,o[k]));return o};
data.forEach(fix);
function sv(t,c){const e=$("sv");e.textContent=t;e.style.color=c||"var(--mut)"}
async function load(){
 if(!data.length)$("st").textContent="Carregando da planilha…";
 try{
  const r=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}&_=${Date.now()}`,{cache:"no-store"});
  if(!r.ok)throw 0;
  const rows=parseCSV(await r.text()).filter(r=>r.some(x=>x.trim()));
  const idx=K.map((k,i)=>rows[0].findIndex(h=>h.trim().toLowerCase()===H[i].toLowerCase()));
  if(idx[0]<0)throw 0;
  data=rows.slice(1).map(r=>{const o={};K.forEach((k,i)=>{const v=idx[i]>=0?(r[idx[i]]||"").trim():"";o[k]=k==="ok"?/^(sim|true|1|x)$/i.test(v):v});
   if(!EDIT&&o.setor in local)o.ok=local[o.setor];return fix(o)}).filter(o=>o.setor);
  save();bairros();render();
  $("sync").textContent="Planilha lida às "+hora();
 }catch(e){bairros();render();$("sync").textContent="Não foi possível ler a planilha (mostrando os dados salvos). Ela precisa estar compartilhada como “Qualquer pessoa com o link”."}
}
function push(op,d,k,ant){if(!EDIT)return;if(!pend)fail=0;hold=Date.now()+8000;pend++;sv("Salvando…");
 fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({op,gid:GID,setor:d.setor,ant:ant||d.setor,k,v:k?d[k]:null,row:d})})
 .then(r=>r.text()).then(t=>{if(t.trim()!=="ok")throw 0}).catch(()=>{fail++}).finally(()=>{pend--;if(pend)return;
  if(fail)sv("⚠ Erro ao salvar ("+fail+"). Verifique a conexão e o Apps Script.","#c0392b");else{sv("✓ Salvo às "+hora(),"#1e8e3e");setTimeout(load,3000)}})}
function save(){try{localStorage.setItem("setores_v1",JSON.stringify(data))}catch(e){}}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function bairros(){const u=k=>[...new Set(data.map(d=>d[k]).filter(Boolean))].sort(),b=u("bairro"),cur=$("fb").value;
 $("fb").innerHTML='<option value="">Todos os bairros</option>'+b.map(x=>`<option${x===cur?" selected":""}>${esc(x)}</option>`).join("");
 $("bl").innerHTML=b.map(x=>`<option value="${esc(x)}">`).join("");$("al").innerHTML=u("apm").map(x=>`<option value="${esc(x)}">`).join("")}
function render(){
 const q=$("q").value.toLowerCase(),fb=$("fb").value,fs=$("fs").value;
 const rows=data.map((d,i)=>[d,i]).filter(([d])=>(!q||K.some(k=>k!=="ok"&&String(d[k]).toLowerCase().includes(q)))&&(!fb||d.bairro===fb)&&(!fs||(fs==="d")===d.ok));
 $("tb").innerHTML=rows.map(([d,i])=>`<tr class="${d.ok?"done":""}" data-i="${i}">`+K.map(k=>k==="ok"?`<td class="chk"><input type="checkbox" ${d.ok?"checked":""} aria-label="Concluído"></td>`:`<td ${EDIT?'contenteditable="plaintext-only"':""} ${ML.includes(k)?'class="ml" title="Enter = nova linha · Ctrl+Enter = salvar"':""} data-k="${k}">${esc(d[k])}</td>`).join("")+`<td class="act"><button title="Excluir setor" aria-label="Excluir">✕</button></td></tr>`).join("");
 $("em").hidden=rows.length>0;
 const done=data.filter(d=>d.ok).length;
 $("st").textContent=`${data.length} setores · ${done} concluídos · ${data.length-done} pendentes`;
}
const upd=()=>$("un").disabled=!U.length;
function setVal(d,k,v,rec=true){const old=d[k],ant=d.setor;if(old===v)return;d[k]=v;if(rec)U.push({t:"set",s:d.setor,k,old});
 if(k==="ok"&&!EDIT){local[d.setor]=v;try{localStorage.setItem("status_local",JSON.stringify(local))}catch(x){}}
 save();push("set",d,k,ant);upd()}
$("un").onclick=()=>{const u=U.pop();if(!u)return;
 if(u.t==="set"){const d=data.find(x=>x.setor===u.s);if(d)setVal(d,u.k,u.old,false)}
 else if(u.t==="add"){const i=data.findIndex(x=>x.setor===u.s);if(i>=0){push("del",data[i]);data.splice(i,1)}}
 else{data.splice(Math.min(u.i,data.length),0,u.d);push("add",u.d)}
 save();bairros();render();upd()};
$("tb").addEventListener("change",e=>{if(e.target.type!=="checkbox")return;setVal(data[e.target.closest("tr").dataset.i],"ok",e.target.checked);render()});
$("tb").addEventListener("focusout",e=>{const td=e.target.closest("td[data-k]");if(!td)return;const d=data[td.parentNode.dataset.i],k=td.dataset.k,v=norm(k,td.innerText);
 if(k==="setor"&&(!v||data.some(x=>x!==d&&x.setor===v))){alert(v?"Já existe um setor com este número.":"O setor não pode ficar vazio.");td.textContent=d.setor;return}
 td.textContent=v;if(d[k]!==v){setVal(d,k,v);if(k==="bairro"||k==="apm")bairros()}});
$("tb").addEventListener("keydown",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k&&e.key==="Enter"&&(!ML.includes(k)||e.ctrlKey)){e.preventDefault();e.target.blur()}});
$("tb").addEventListener("click",e=>{const b=e.target.closest(".act button");if(!b)return;const i=+b.closest("tr").dataset.i;
 if(confirm("Excluir o setor "+data[i].setor+"?")){U.push({t:"del",i,d:data[i]});push("del",data[i]);data.splice(i,1);save();bairros();render();upd()}});
["q","fb","fs"].forEach(id=>$(id).addEventListener("input",render));
$("add").onclick=()=>{$("fm").reset();$("dlg").showModal()};
$("cn").onclick=()=>$("dlg").close();
$("fm").addEventListener("submit",e=>{const f=new FormData($("fm")),s=f.get("setor").trim();
 if(data.some(x=>x.setor===s)){e.preventDefault();alert("Já existe um setor com este número.");return}
 const o={ok:false};K.forEach(k=>{if(k!=="ok")o[k]=norm(k,f.get(k)??"")});
 data.push(o);U.push({t:"add",s:o.setor});push("add",o);save();bairros();render();upd()});
function csvLine(a){return a.map(v=>{v=String(v??"");return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(";")}
function dl(n,rows){const t="\ufeff"+rows.map(csvLine).join("\n");try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.download=n;a.click()}catch(e){alert("Não foi possível baixar o arquivo neste ambiente.")}}
$("exp").onclick=()=>dl("setores.csv",[H].concat(data.map(d=>K.map(k=>k==="ok"?(d.ok?"Sim":"Não"):d[k]))));
// ===== Tema =====
function theme(t){document.documentElement.dataset.theme=t;$("th").textContent=t==="dark"?"☀ Claro":"🌙 Escuro";try{localStorage.setItem("tema",t)}catch(e){}}
let t0=null;try{t0=localStorage.getItem("tema")}catch(e){}
theme(t0||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
$("th").onclick=()=>theme(document.documentElement.dataset.theme==="dark"?"light":"dark");
// ===== Relatório =====
$("rc").innerHTML=H.map((h,i)=>`<option value="${i}">${h}</option>`).join("");
const disp=(d,k)=>k==="ok"?(d.ok?"Concluído":"Pendente"):String(d[k]??"");
let rep=[];
function rlist(){const k=K[+$("rc").value];$("rl").innerHTML=[...new Set(data.flatMap(d=>disp(d,k).split("\n")).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">`).join("")}
function report(){const i=+$("rc").value,k=K[i],op=$("rop").value,v=$("rv").value.trim().toLowerCase();
 rep=data.filter(d=>{const x=disp(d,k).trim().toLowerCase();
  return op==="c"?x.includes(v):op==="e"?x.split("\n").includes(v)||x===v:op==="v"?!x:op==="n"?!!x:op==="g"?parseFloat(x)>parseFloat(v):parseFloat(x)<parseFloat(v)});
 const s=f=>rep.reduce((a,d)=>a+(parseFloat(d[f])||0),0);
 const crit=H[i]+" "+$("rop").selectedOptions[0].text+(["v","n"].includes(op)?"":" “"+$("rv").value+"”");
 $("rr").innerHTML=`<h3>Relatório: ${esc(crit)}</h3><p>${rep.length} de ${data.length} setores · EUV ${s("euv")} · EDOC ${s("edoc")} · emitido em ${new Date().toLocaleString("pt-BR")}</p><div class="wrap2"><table><thead><tr>${H.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rep.map(d=>"<tr>"+K.map(k=>`<td class="ml">${esc(disp(d,k))}</td>`).join("")+"</tr>").join("")}</tbody></table></div>`}
$("rc").addEventListener("input",()=>{$("rv").value="";rlist()});
["rc","rop","rv"].forEach(id=>$(id).addEventListener("input",report));
$("rpt").onclick=()=>{rlist();report();$("rd").showModal()};
$("rk").onclick=()=>$("rd").close();
$("rx").onclick=()=>dl("relatorio.csv",[H].concat(rep.map(d=>K.map(k=>disp(d,k)))));
$("rp").onclick=()=>{document.body.classList.add("pr");print()};
addEventListener("afterprint",()=>document.body.classList.remove("pr"));
function parseCSV(t){const sep=(t.split("\n")[0].match(/;/g)||[]).length>=(t.split("\n")[0].match(/,/g)||[]).length?";":",";
