    const SUPABASE_URL = 'https://rdxklpkukmuwwetftqde.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sklR4egsYWIHZ3UMdWLyWQ_NHOVkD16'; // Substitua pela sua chave anon public

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function contaAprovada(userId) {
        const { data, error } = await _supabase
            .from('perfis')
            .select('aprovado')
            .eq('id', userId)
            .maybeSingle();
        if (error) return false;
        return data ? data.aprovado === true : false;
    }

    (async function protegerPagina() {
        const { data: { session } } = await _supabase.auth.getSession();
        
        if (!session) {
            window.location.replace('index.html');
            return;
        }

        const aprovado = await contaAprovada(session.user.id);
        if (!aprovado) {
            await _supabase.auth.signOut();
            window.location.replace('index.html');
        }
    })();
</script>

 if(k==="tel"||k==="tel2")return telLines(v,true).filter(Boolean).join("\n");
 if(k==="email"){const m=v.match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g);return(m||v.split(/[\n;,\s]+/).map(x=>x.trim()).filter(Boolean)).join("\n").toLowerCase()}
 if(k==="apm")return[...new Set(v.split(/[\n;,]+/).map(x=>x.trim()).filter(Boolean))].join("\n");
 return v.trim()}
const fix=o=>{K.forEach(k=>{if(o[k]==null)o[k]=(k==="ok"||k==="risco")?false:""});ML.concat("apm").forEach(k=>o[k]=norm(k,o[k]));return o};
data.forEach(fix);
function sv(t,c){const e=$("sv");e.textContent=t;e.style.color=c||"var(--mut)"}
async function load(){
 if(fila.length||enviando){btnSalvar();return}
 if(!data.length)$("st").textContent="Carregando da planilha…";
 try{
  const r=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}&_=${Date.now()}`,{cache:"no-store"});
  if(!r.ok)throw 0;
  const rows=parseCSV(await r.text()).filter(r=>r.some(x=>x.trim()));
  const idx=hIdx(rows[0]);
  if(idx[K.indexOf("setor")]<0)throw 0;
  const prev={};data.forEach(d=>prev[d.setor]=d);
  data=rows.slice(1).map(r=>{const o={};K.forEach((k,i)=>{const v=idx[i]>=0?(r[idx[i]]||"").trim():(k==="pri"&&prev[o.setor]?prev[o.setor].pri:"");o[k]=(k==="ok"||k==="risco")?/^(sim|true|1|x|verdadeiro)$/i.test(v):v});
   if(!EDIT&&o.setor in local)o.ok=local[o.setor];return fix(o)}).filter(o=>o.setor);
  save();bairros();render();
  $("sync").textContent="Planilha lida às "+hora();
 }catch(e){bairros();render();$("sync").textContent="Não foi possível ler a planilha (mostrando os dados salvos). Ela precisa estar compartilhada como “Qualquer pessoa com o link”."}
}
let fila=[],enviando=false;try{const f=JSON.parse(localStorage.getItem("fila_aja")||"[]");if(Array.isArray(f))fila=f}catch(e){}
function saveFila(){try{localStorage.setItem("fila_aja",JSON.stringify(fila))}catch(e){}}
function btnSalvar(){const b=$("bsv"),n=fila.length;b.disabled=!n||enviando;b.textContent=n?`Salvar (${n})`:"Salvar";b.classList.toggle("alt",!!n);
 if(n&&!enviando)sv("● "+n+" alteração(ões) ainda não gravada(s) na planilha. Clique em Salvar.","#d97706")}
function push(op,d,k,ant){if(!EDIT)return;
 const m={op,gid:GID,setor:d.setor,ant:ant||d.setor,k,v:k?d[k]:null,row:op==="add"?JSON.parse(JSON.stringify(d)):null};
 if(op==="set"){const x=fila.find(q=>q.op==="set"&&q.setor===m.setor&&q.ant===m.ant&&q.k===k);if(x)x.v=m.v;else fila.push(m)}else fila.push(m);
 saveFila();btnSalvar()}
async function salvar(){if(enviando||!fila.length)return;enviando=true;hold=Date.now()+8000;$("bsv").disabled=true;sv("Salvando…");let erro="";
 while(fila.length){try{const r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(fila[0])});const t=(await r.text()).trim();if(t!=="ok")throw new Error(t||"sem resposta")}catch(e){erro=e.message||"falha de conexão";break}
  fila.shift();saveFila()}
 enviando=false;btnSalvar();
 if(erro)sv("⚠ Erro ao salvar ("+fila.length+" pendente(s)): "+erro,"#c0392b");else{sv("✓ Salvo às "+hora(),"#1e8e3e");setTimeout(load,3000)}}
$("bsv").onclick=salvar;
addEventListener("beforeunload",e=>{if(fila.length){e.preventDefault();e.returnValue=""}});
function save(){try{localStorage.setItem("setores_v1",JSON.stringify(data))}catch(e){}}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function bairros(){const u=k=>[...new Set(data.map(d=>d[k]).filter(Boolean))].sort(),b=u("bairro"),cur=$("fb").value;
 $("fb").innerHTML='<option value="">Todos os bairros</option>'+b.map(x=>`<option${x===cur?" selected":""}>${esc(x)}</option>`).join("");
 $("bl").innerHTML=b.map(x=>`<option value="${esc(x)}">`).join("")}
function ajustaBairro(){try{const c=ajustaBairro.c||(ajustaBairro.c=document.createElement("canvas").getContext("2d"));c.font="bold 15px Georgia,'Times New Roman',serif";let w=c.measureText("Bairro").width;data.forEach(d=>{if(d.bairro)w=Math.max(w,c.measureText(d.bairro).width)});document.querySelector(".wrap").style.setProperty("--wb",Math.ceil(w+28)+"px")}catch(e){}}
function render(){
 ajustaBairro();
 const fb=$("fb").value,fs=$("fs").value,fp=$("fp").value;
 const rows=data.map((d,i)=>[d,i]).filter(([d])=>(!fsetor||d.setor===fsetor||(fsetor.length===4&&d.setor.endsWith(fsetor)))&&(!fb||d.bairro===fb)&&(!fs||(fs==="d")===d.ok)&&(!fp||(fp==="-"?!d.pri:d.pri===fp)));
 $("tb").innerHTML=rows.map(([d,i])=>`<tr class="${d.ok?"done":d.pri==="CNEFE"?"cnefe":d.pri==="PNAD"?"pnad":""}" data-i="${i}">`+K.map(k=>k==="ok"?`<td class="chk"><input type="checkbox" ${d.ok?"checked":""} aria-label="Concluído"></td>`:k==="risco"?`<td class="chk"><input type="checkbox" data-r="1" ${d.risco?"checked":""} ${EDIT?"":"disabled"} aria-label="Área de Risco"></td>`:k==="pri"?`<td><select class="pri" aria-label="Prioridade CNEFE / PNAD" ${d.ok?"disabled":""}><option value="">—</option><option${d.pri==="CNEFE"?" selected":""}>CNEFE</option><option${d.pri==="PNAD"?" selected":""}>PNAD</option></select></td>`:k==="apm"?apmCell(d):`<td ${EDIT&&!d.ok?'contenteditable="plaintext-only"':""} ${ML.includes(k)?'class="ml" title="Enter = nova linha · Ctrl+Enter = confirmar"':""} data-k="${k}">${esc(d[k])}</td>`).join("")+`<td class="act"><button title="Excluir setor" aria-label="Excluir" ${d.ok?"disabled":""}>✕</button></td></tr>`).join("");
 $("em").hidden=rows.length>0;
 const done=data.filter(d=>d.ok).length;
 const pc=n=>(data.length?n/data.length*100:0).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";
 $("st").textContent=`${data.length} setores · ${done} concluídos (${pc(done)}) · ${data.length-done} pendentes (${pc(data.length-done)})`;
}
function setVal(d,k,v){const old=d[k],ant=d.setor;if(old===v)return;d[k]=v;
 if(k==="ok"&&!EDIT){local[d.setor]=v;try{localStorage.setItem("status_local",JSON.stringify(local))}catch(x){}}
 save();push("set",d,k,ant)}
$("tb").addEventListener("change",e=>{if(e.target.type!=="checkbox")return;setVal(data[e.target.closest("tr").dataset.i],e.target.dataset.r?"risco":"ok",e.target.checked);render()});
$("tb").addEventListener("change",e=>{const t=e.target;if(!t.matches("select.pri,select.apm"))return;const d=data[t.closest("tr").dataset.i];
 if(t.classList.contains("apm")){const a=apmArr(d.apm);if(t.value&&!a.includes(t.value)){a.push(t.value);setVal(d,"apm",a.join("\n"))}}
 else setVal(d,"pri",t.value);
 render()});
$("tb").addEventListener("click",e=>{const b=e.target.closest(".chip button");if(!b)return;const d=data[b.closest("tr").dataset.i],a=apmArr(d.apm);a.splice(+b.dataset.n,1);setVal(d,"apm",a.join("\n"));render()});
$("tb").addEventListener("focusout",e=>{const td=e.target.closest("td[data-k]");if(!td)return;const d=data[td.parentNode.dataset.i],k=td.dataset.k,v=norm(k,td.innerText);
 if(k==="setor"&&(!v||data.some(x=>x!==d&&x.setor===v))){alert(v?"Já existe um setor com este número.":"O setor não pode ficar vazio.");td.textContent=d.setor;return}
 td.textContent=v;if(d[k]!==v){setVal(d,k,v);if(k==="bairro"||k==="apm")bairros()}});
$("tb").addEventListener("keydown",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k&&e.key==="Enter"&&(!ML.includes(k)||e.ctrlKey)){e.preventDefault();e.target.blur()}});
$("tb").addEventListener("click",e=>{const b=e.target.closest(".act button");if(!b)return;const i=+b.closest("tr").dataset.i;
 if(confirm("Excluir o setor "+data[i].setor+"?")){push("del",data[i]);data.splice(i,1);save();bairros();render()}});
["fb","fs","fp"].forEach(id=>$(id).addEventListener("input",render));
// ===== Telefone e e-mail: só caracteres válidos, um embaixo do outro, automático =====
const telEmail=el=>el&&el.matches?(el.matches("td[data-k=tel],td[data-k=email]")?el.dataset.k:el.matches("#fm textarea[name=tel],#fm textarea[name=email]")?el.name:null):null;
document.addEventListener("beforeinput",e=>{const k=telEmail(e.target),ch=e.data;if(!k||e.inputType!=="insertText"||!ch||ch.length!==1)return;
 let out;
 if(k==="tel"){if(/\d/.test(ch))return;out=/[;,\/|]/.test(ch)?"\n":""}
 else{if(!/[ \t,;]/.test(ch))return;out="\n"}
 e.preventDefault();
 if(out&&!document.execCommand("insertText",false,out)&&e.target.setRangeText){const t=e.target;t.setRangeText(out,t.selectionStart,t.selectionEnd,"end");t.dispatchEvent(new Event("input",{bubbles:true}))}});
function liveFix(el){const ta=el.tagName==="TEXTAREA",k=ta?el.name:el.dataset.k;let raw,pos;
 if(ta){raw=el.value;pos=el.selectionStart}
 else{raw=el.innerText;const sl=getSelection();if(!sl.rangeCount||!el.contains(sl.anchorNode))return;
  const r=sl.getRangeAt(0).cloneRange();r.selectNodeContents(el);r.setEnd(sl.anchorNode,sl.anchorOffset);pos=r.toString().length}
 const nw=k==="tel"?telLines(raw,false).join("\n"):emailLive(raw);if(nw===raw)return;
 const sig=k==="tel"?/\d/:/[^\s,;]/,brk=k==="tel"?/[\n;,\/|]/:/[\s,;]/,before=raw.slice(0,pos);
 let n=0,last=-1;for(let i=0;i<before.length;i++)if(sig.test(before[i])){n++;last=i}
 let np=0,c=0;
 if(pos>=raw.length)np=nw.length;
 else{if(n>0)for(;np<nw.length&&c<n;np++)if(sig.test(nw[np]))c++;
  if(brk.test(before.slice(last+1))&&nw[np]==="\n")np++}
 if(ta){el.value=nw;el.setSelectionRange(np,np)}
 else{el.textContent=nw;const t=el.firstChild;if(t){const r=document.createRange();r.setStart(t,Math.min(np,t.length));r.collapse(true);const sl=getSelection();sl.removeAllRanges();sl.addRange(r)}}}
$("tb").addEventListener("input",e=>{if(e.isComposing)return;const t=e.target.closest&&e.target.closest("td[data-k=tel],td[data-k=email]");if(t&&t.isContentEditable)liveFix(t)});
$("fm").addEventListener("input",e=>{if(e.isComposing)return;if(telEmail(e.target))liveFix(e.target)});
// ===== APMs (lista de nomes) =====
function listaApms(){const l=apmList();$("lap").innerHTML=l.length?l.map((n,i)=>`<li style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line)"><span>${esc(n)}</span><button data-i="${i}" title="Excluir da lista" aria-label="Excluir ${esc(n)}">✕</button></li>`).join(""):'<li class="empty" style="padding:14px">Nenhum APM na lista.</li>'}
function setApms(a){APMS=a;try{localStorage.setItem("apms_lista",JSON.stringify(a))}catch(e){}listaApms();fillApmForm();render()}
$("bap").onclick=()=>{$("mpa").textContent="";$("nap").value="";listaApms();$("dap").showModal();$("nap").focus()};
$("xap").onclick=()=>$("dap").close();
$("nap").addEventListener("input",()=>$("mpa").textContent="");
$("fap").addEventListener("submit",e=>{e.preventDefault();const n=$("nap").value.replace(/\s+/g," ").trim();
 if(!n){$("mpa").textContent="Digite o nome do APM.";return}
 const l=apmList();if(l.some(x=>x.toLowerCase()===n.toLowerCase())){$("mpa").textContent="Este nome já está na lista.";return}
 setApms(l.concat(n));$("nap").value="";$("nap").focus()});
$("lap").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const n=apmList()[+b.dataset.i];if(n==null)return;
 const uso=data.filter(d=>apmArr(d.apm).includes(n)).length;
 if(!confirm(uso?`Excluir "${n}" da lista? ${uso} setor(es) continuam com este nome.`:`Excluir "${n}" da lista?`))return;
 setApms(apmList().filter(x=>x!==n))});
// ===== Pesquisar Setor (número completo ou 4 últimos; só dígitos) =====
const nps=$("nps"),mps=$("mps");
nps.addEventListener("input",()=>{nps.value=nps.value.replace(/\D/g,"");mps.textContent=""});
$("ps").onclick=()=>{mps.textContent="";nps.value=fsetor;$("dps").showModal();nps.focus()};
$("cps").onclick=()=>$("dps").close();
$("fps").addEventListener("submit",e=>{e.preventDefault();const v=nps.value;
 if(!v){mps.textContent="Digite o número do setor.";return}
 if(v.length!==4&&!data.some(d=>d.setor===v)){mps.textContent="Digite o número completo do setor ou apenas os 4 últimos números.";return}
 if(!data.some(d=>d.setor===v||(v.length===4&&d.setor.endsWith(v)))){mps.textContent="Nenhum setor encontrado com esse número.";return}
 fsetor=v;$("pl").hidden=false;$("pl").textContent="✕ Setor: "+v;$("dps").close();render()});
$("pl").onclick=()=>{fsetor="";$("pl").hidden=true;render()};
$("add").onclick=()=>{fillApmForm();$("fm").reset();$("dlg").showModal()};
$("cn").onclick=()=>$("dlg").close();
$("fm").addEventListener("submit",e=>{const f=new FormData($("fm")),s=f.get("setor").trim();
 if(data.some(x=>x.setor===s)){e.preventDefault();alert("Já existe um setor com este número.");return}
 const o={ok:false,risco:f.has("risco")};K.forEach(k=>{if(k!=="ok"&&k!=="risco")o[k]=norm(k,k==="apm"?f.getAll("apm").join("\n"):(f.get(k)??""))});
 data.push(o);push("add",o);save();bairros();render()});
function csvLine(a){return a.map(v=>{v=String(v??"");return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(";")}
function dl(n,rows){const t="\ufeff"+rows.map(csvLine).join("\n");try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.download=n;a.click()}catch(e){alert("Não foi possível baixar o arquivo neste ambiente.")}}
$("exp").onclick=()=>dl("setores.csv",[H].concat(data.map(d=>K.map(k=>k==="ok"?(d.ok?"Sim":"Não"):k==="risco"?(d.risco?"Sim":"Não"):d[k]))));
// ===== Tema =====
function theme(t){document.documentElement.dataset.theme=t;$("th").textContent=t==="dark"?"☀️":"🌙";try{localStorage.setItem("tema",t)}catch(e){}}
let t0=null;try{t0=localStorage.getItem("tema")}catch(e){}
theme(t0||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
$("th").onclick=()=>theme(document.documentElement.dataset.theme==="dark"?"light":"dark");
// ===== Relatório =====
$("rc").innerHTML=H.map((h,i)=>`<option value="${i}">${h}</option>`).join("");
const disp=(d,k)=>k==="ok"?(d.ok?"Concluído":"Pendente"):k==="risco"?(d.risco?"Sim":"Não"):String(d[k]??"");
let rep=[];
function rlist(){const k=K[+$("rc").value];$("rl").innerHTML=[...new Set(data.flatMap(d=>disp(d,k).split("\n")).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">`).join("")}
function report(){const i=+$("rc").value,k=K[i],op=$("rop").value,v=$("rv").value.trim().toLowerCase();
 rep=data.filter(d=>{const x=disp(d,k).trim().toLowerCase();
  return op==="c"?x.includes(v):op==="e"?x.split("\n").includes(v)||x===v:op==="v"?!x:op==="n"?!!x:op==="g"?parseFloat(x)>parseFloat(v):parseFloat(x)<parseFloat(v)});
 const s=f=>rep.reduce((a,d)=>a+(parseFloat(d[f])||0),0);
 const crit=H[i]+" "+$("rop").selectedOptions[0].text+(["v","n"].includes(op)?"":" “"+$("rv").value+"”");
 $("rr").innerHTML=`<h3>Relatório: ${esc(crit)}</h3><p>${rep.length} de ${data.length} setores · EUV ${s("euv")} · EDOC ${s("edoc")} · emitido em ${new Date().toLocaleString("pt-BR")}</p><div class="wrap2"><table><thead><tr>${H.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rep.map(d=>"<tr>"+K.map(k=>`<td class="ml${k==="obs"||k==="end"?" l":""}">${esc(disp(d,k))}</td>`).join("")+"</tr>").join("")}</tbody></table></div>`}
$("rc").addEventListener("input",()=>{$("rv").value="";rlist()});

const PCOLS=["setor","euv","edoc","tipo","bairro","pri","end","tel","obs","apm"];
$("pcl").innerHTML=K.map((k,i)=>`<label><input type="checkbox" value="${k}"${PCOLS.includes(k)?" checked":""}> ${H[i]}</label>`).join("");
function prRows(m){const fb=$("fb").value,fs=$("fs").value,fp=$("fp").value;
 return data.filter(d=>m==="a"?true:m==="p"?!d.ok:m==="d"?d.ok:(!fsetor||d.setor===fsetor||(fsetor.length===4&&d.setor.endsWith(fsetor)))&&(!fb||d.bairro===fb)&&(!fs||(fs==="d")===d.ok)&&(!fp||(fp==="-"?!d.pri:d.pri===fp)))}
function prDesc(m){if(m!=="t")return{a:"Todos os setores",p:"Setores pendentes",d:"Setores concluídos"}[m];
 const p=[];if(fsetor)p.push("setor "+fsetor);if($("fb").value)p.push($("fb").value);if($("fs").value)p.push($("fs").selectedOptions[0].text);if($("fp").value)p.push($("fp").selectedOptions[0].text);

 $("pt").innerHTML=`<h3>${esc(document.querySelector("h1").textContent)}</h3><p>${esc(prDesc(m))} · ${rows.length} de ${data.length} setores · EUV ${s("euv")} · EDOC ${s("edoc")} · emitido em ${new Date().toLocaleString("pt-BR")}</p><div class="wrap2"><table><thead><tr>${cols.map(k=>`<th>${H[K.indexOf(k)]}</th>`).join("")}</tr></thead><tbody>${rows.map(d=>`<tr class="${d.ok?"r-d":d.pri==="CNEFE"?"r-c":d.pri==="PNAD"?"r-p":""}">`+cols.map(k=>`<td class="ml${k==="obs"||k==="end"?" l":""}">${esc(disp(d,k))}</td>`).join("")+"</tr>").join("")}</tbody></table></div>`}

function parseCSV(t){const sep=(t.split("\n")[0].match(/;/g)||[]).length>=(t.split("\n")[0].match(/,/g)||[]).length?";":",";
 const out=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'&&t[i+1]==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}
  else if(ch==='"')q=true;else if(ch===sep){r.push(c);c=""}else if(ch==="\n"){r.push(c);out.push(r);r=[];c=""}else if(ch!=="\r")c+=ch}
 if(c||r.length){r.push(c);out.push(r)}return out}
if(!EDIT){$("add").hidden=true;$("bsv").hidden=true;document.body.classList.add("ro");sv("Modo leitura: configure SCRIPT_URL para salvar na planilha.")}
$("rf").onclick=()=>{if(fila.length){if(!confirm("Há "+fila.length+" alteração(ões) não salva(s). Atualizar agora vai descartá-las. Continuar?"))return;fila=[];saveFila();sv("");btnSalvar()}load()};btnSalvar();load();
setInterval(()=>{if(!document.hidden&&Date.now()>hold&&!document.activeElement.isContentEditable&&!document.activeElement.matches("select.pri,select.apm"))load()},10000);
