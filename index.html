<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style id="guarda-css">html{visibility:hidden}</style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    (async function () {
      // Exibe a página de login sem tentar redirecionar para ela mesma
      const css = document.getElementById('guarda-css');
      if (css) css.remove();
    })();
    </script>
    <title>Acesso ao Sistema - Base Territorial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: Arial, sans-serif;
            background-image: url('background.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 320px;
            z-index: 10;
        }
        .login-card h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: #666;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: default;
        }
        .links {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
        }
        .links a {
            color: #007bff;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .msg {
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        .msg-erro { color: #d9534f; }
        .msg-sucesso { color: #28a745; }
        .msg-aviso { color: #b7791f; }
        .form-section { display: none; }
        .form-section.active { display: block; }
    </style>
</head>
<body>

<div class="login-card">

    <!-- FORMULÁRIO DE LOGIN -->
    <div id="sec-login" class="form-section active">
        <h2>Login</h2>
        <form onsubmit="fazerLogin(event)">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required>
            </div>
            <button type="submit" id="btn-login" class="btn-submit">Entrar</button>
            <div id="msg-login" class="msg"></div>
        </form>
        <div class="links">
            <a href="#" onclick="mostrarSessao('sec-registro')">Criar conta / Criar senha</a>
        </div>
    </div>

    <!-- FORMULÁRIO DE REGISTRO -->
    <div id="sec-registro" class="form-section">
        <h2>Criar Conta</h2>
        <form onsubmit="cadastrarUsuario(event)">
            <div class="form-group">
                <label for="reg-email">Seu E-mail</label>
                <input type="email" id="reg-email" required>
            </div>
            <div class="form-group">
                <label for="reg-senha">Crie uma Senha</label>
                <input type="password" id="reg-senha" minlength="6" required>
            </div>
            <button type="submit" id="btn-registro" class="btn-submit">Cadastrar</button>
            <div id="msg-reg" class="msg"></div>
        </form>
        <div class="links">
            <a href="#" onclick="mostrarSessao('sec-login')">Voltar ao Login</a>
        </div>
    </div>

</div>

<script>
    // =========================================================================
    // CONFIGURAÇÃO DO SUPABASE (BASE_TERRITORIAL_2026)
    // =========================================================================
    const SUPABASE_URL = 'https://rdxklpkukmuwwetftqde.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sklR4egsYWIHZ3UMdWLyWQ_NHOVkD16'; 

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function mostrarSessao(idSessao) {
        document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.msg').forEach(el => el.style.display = 'none');
        document.getElementById(idSessao).classList.add('active');
    }

    function mostrarMsg(el, tipo, texto) {
        el.className = 'msg msg-' + tipo;
        el.innerText = texto;
        el.style.display = 'block';
    }

    async function contaAprovada(userId) {
        const { data, error } = await _supabase
            .from('perfis')
            .select('aprovado')
            .eq('id', userId)
            .maybeSingle();
        if (error) return null;
        return data ? data.aprovado === true : false;
    }

    // Se o utilizador já estiver logado e aprovado, encaminha para setores.html
    (async function verificarSessaoExistente() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session && (await contaAprovada(session.user.id)) === true) {
            window.location.replace('setores.html');
        }
    })();

    async function cadastrarUsuario(event) {
        event.preventDefault();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-senha').value;
        const msg = document.getElementById('msg-reg');
        const btn = document.getElementById('btn-registro');

        btn.disabled = true;
        btn.innerText = 'Processando...';
        msg.style.display = 'none';

        const { data, error } = await _supabase.auth.signUp({ email, password });

        if (error) {
            mostrarMsg(msg, 'erro', 'Erro ao cadastrar: ' + error.message);
        } else {
            if (data.session) await _supabase.auth.signOut();
            mostrarMsg(msg, 'sucesso', 'Conta criada! Aguarde a aprovação do administrador para acessar.');
            document.getElementById('reg-email').value = '';
            document.getElementById('reg-senha').value = '';
        }

        btn.disabled = false;
        btn.innerText = 'Cadastrar';
    }

    async function fazerLogin(event) {
        event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('senha').value;
        const msg = document.getElementById('msg-login');
        const btn = document.getElementById('btn-login');

        btn.disabled = true;
        btn.innerText = 'Verificando...';
        msg.style.display = 'none';

        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

        if (error) {
            mostrarMsg(msg, 'erro', 'E-mail ou senha incorretos.');
        } else {
            const aprovada = await contaAprovada(data.user.id);

            if (aprovada === true) {
                window.location.href = 'setores.html';
                return;
            }

            await _supabase.auth.signOut();
            if (aprovada === false) {
                mostrarMsg(msg, 'aviso', 'Sua conta está pendente de aprovação pelo administrador.');
            } else {
                mostrarMsg(msg, 'erro', 'Não foi possível verificar a sua conta. Tente novamente.');
            }
        }

        btn.disabled = false;
        btn.innerText = 'Entrar';
    }
</script>

</body>
</html>
