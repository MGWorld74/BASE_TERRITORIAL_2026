<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>Previsão de finalização - Base Territorial</title>

<!-- SDK Oficial do Supabase e Proteção de Acesso (mesmo padrão de setoresABT/AJA) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://rdxklpkukmuwwetftqde.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sklR4egsYWIHZ3UMdWLyWQ_NHOVkD16';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function contaAprovada(userId) {
        const { data, error } = await _supabase.from('perfis').select('aprovado').eq('id', userId).maybeSingle();
        if (error) return false;
        return data ? data.aprovado === true : false;
    }

    (async function protegerPagina() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) { window.location.replace('index.html'); return; }
        const aprovado = await contaAprovada(session.user.id);
        if (!aprovado) {
            await _supabase.auth.signOut();
            window.location.replace('index.html');
        }
    })();
</script>

<style>
:root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --primary: #1e3a8a; --accent: #2563eb; --bg: #f8fafc; --card-bg: #ffffff;
    --text: #1e293b; --border: #e2e8f0; --mut: #64748b; --box: #f1f5f9; --res: #eff6ff;
    --ok: #16a34a; --pend: #dc2626; --musgo: #4a5d23;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --primary: #93b4f5; --accent: #7aa7e6; --bg: #12161d; --card-bg: #1a202b;
        --text: #e6e9ef; --border: #2c3547; --mut: #99a2b3; --box: #202838; --res: #16233b;
        --ok: #4ade80; --pend: #f87171;
    }
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
.container { max-width: 1000px; margin: 0 auto; }
.topo { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.btn { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; font-size: 0.9rem; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .6; cursor: default; }
h1 { color: var(--primary); text-align: center; margin: 10px 0 6px; }
#sync { text-align: center; color: var(--mut); font-size: 0.85rem; margin-bottom: 24px; min-height: 1.2em; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; }
.card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,.1); border: 1px solid var(--border); }
.card-header { border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; font-size: 1.2rem; color: var(--primary); }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; text-align: center; }
.stat-box { background: var(--box); padding: 10px 4px; border-radius: 8px; }
.stat-box label { display: block; font-size: 0.8rem; color: var(--mut); }
.stat-box span { font-size: 1.05rem; font-weight: bold; }
.barra { height: 8px; background: var(--box); border-radius: 4px; overflow: hidden; margin-bottom: 18px; }
.barra div { height: 100%; width: 0; background: var(--ok); transition: width .3s; }
.controls-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
.control-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; font-weight: 600; }
.control-group input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg); color: var(--text); font-size: 1rem; }
.results { background: var(--res); border-left: 4px solid var(--accent); padding: 15px; border-radius: 0 8px 8px 0; }
.results div { margin-bottom: 8px; }
.results div:last-child { margin-bottom: 0; }
.highlight { font-weight: bold; color: var(--accent); }
.nota { color: var(--mut); font-size: 0.8rem; text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
    <div class="topo">
        <a class="btn" href="index.html">← Voltar</a>
        <button class="btn" id="btn-atualizar" type="button">Atualizar agora</button>
    </div>

    <h1>Previsão de finalização</h1>
    <div id="sync">Carregando das planilhas…</div>

    <div class="grid" id="grid"></div>

    <p class="nota">A previsão conta apenas dias úteis (segunda a sexta), a partir de hoje, e não desconta feriados. Os valores de APMs e meta ficam salvos neste navegador.</p>
</div>

<script>
// Mesmas planilhas lidas por setoresABT.html e setoresAJA.html
const AGENCIAS = {
    abt: { nome: 'ABT', sheet: '1DySyEYxXPOS9b_dq9rg5llojf4EAiGvqKL4GSzIibs8', gid: '1741145519' },
    aja: { nome: 'AJA', sheet: '1Bu5hq9aRMeWh-4bk9-34QZ0InyrtitQEved6-iEQ7Dc', gid: '1534942531' }
};
const STORE_CFG = 'previsao_cfg_v1', STORE_DADOS = 'previsao_dados_v1';
const $ = id => document.getElementById(id);
const fmtInt = n => n.toLocaleString('pt-BR');
const fmtPct = n => n.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';

let cfg = {}; try { cfg = JSON.parse(localStorage.getItem(STORE_CFG) || '{}'); } catch (e) {}
let dados = {}; try { dados = JSON.parse(localStorage.getItem(STORE_DADOS) || '{}'); } catch (e) {}

// Monta os dois cartões
$('grid').innerHTML = Object.entries(AGENCIAS).map(([k, a]) => `
<div class="card">
    <div class="card-header">Setores Ordenados - ${a.nome}</div>
    <div class="stats-grid">
        <div class="stat-box"><label>Total</label><span id="${k}-total">-</span></div>
        <div class="stat-box"><label>Concluídos</label><span id="${k}-conc" style="color:var(--ok)">-</span></div>
        <div class="stat-box"><label>Pendentes</label><span id="${k}-pend" style="color:var(--pend)">-</span></div>
    </div>
    <div class="barra" aria-hidden="true"><div id="${k}-barra"></div></div>
    <div class="controls-row">
        <div class="control-group"><label for="${k}-apms">Quantidade de APMs:</label>
            <input type="number" id="${k}-apms" min="0" step="1" inputmode="numeric" value="${(cfg[k] && cfg[k].apms) ?? 0}"></div>
        <div class="control-group"><label for="${k}-meta">Meta semanal (por APM):</label>
            <input type="number" id="${k}-meta" min="0" step="1" inputmode="numeric" value="${(cfg[k] && cfg[k].meta) ?? 17}"></div>
    </div>
    <div class="results">
        <div>Capacidade total da equipe: <span class="highlight" id="${k}-cap">0</span> setores/sem</div>
        <div>Semanas necessárias: <span class="highlight" id="${k}-sem">-</span></div>
        <div>Previsão de término: <span class="highlight" id="${k}-data">-</span></div>
    </div>
</div>`).join('');

Object.keys(AGENCIAS).forEach(k => ['apms', 'meta'].forEach(c => {
    $(`${k}-${c}`).addEventListener('input', () => { salvarCfg(); calcular(k); });
}));

function salvarCfg() {
    Object.keys(AGENCIAS).forEach(k => cfg[k] = { apms: $(`${k}-apms`).value, meta: $(`${k}-meta`).value });
    try { localStorage.setItem(STORE_CFG, JSON.stringify(cfg)); } catch (e) {}
}

function parseCSV(t) {
    const rows = []; let r = [], c = '', q = false;
    for (let i = 0; i < t.length; i++) {
        const ch = t[i];
        if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
        else if (ch === '"') q = true;
        else if (ch === ',') { r.push(c); c = ''; }
        else if (ch === '\n') { r.push(c); rows.push(r); r = []; c = ''; }
        else if (ch !== '\r') c += ch;
    }
    if (c !== '' || r.length) { r.push(c); rows.push(r); }
    return rows.filter(x => x.some(v => v.trim()));
}

// Soma n dias úteis (seg-sex) a partir de hoje
function somaDiasUteis(n) {
    const d = new Date();
    while (n > 0) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) n--; }
    return d;
}

function calcular(k) {
    const d = dados[k]; if (!d) return;
    const pend = d.total - d.conc;
    $(`${k}-total`).textContent = fmtInt(d.total);
    $(`${k}-conc`).textContent = `${fmtInt(d.conc)} (${fmtPct(d.total ? d.conc / d.total * 100 : 0)})`;
    $(`${k}-pend`).textContent = fmtInt(pend);
    $(`${k}-barra`).style.width = (d.total ? d.conc / d.total * 100 : 0) + '%';

    const apms = parseFloat($(`${k}-apms`).value) || 0;
    const meta = parseFloat($(`${k}-meta`).value) || 0;
    const cap = apms * meta;
    $(`${k}-cap`).textContent = fmtInt(cap);

    if (pend <= 0) { $(`${k}-sem`).textContent = '0'; $(`${k}-data`).textContent = 'Todos os setores concluídos'; return; }
    if (cap <= 0) { $(`${k}-sem`).textContent = '-'; $(`${k}-data`).textContent = 'Informe a quantidade de APMs e a meta'; return; }

    const semanas = pend / cap;
    const diasUteis = Math.ceil(semanas * 5);
    $(`${k}-sem`).textContent = `${semanas.toLocaleString('pt-BR', { maximumFractionDigits: 1 })} semanas (${fmtInt(diasUteis)} dias úteis)`;
    $(`${k}-data`).textContent = somaDiasUteis(diasUteis).toLocaleString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
}

async function lerPlanilha(a) {
    const r = await fetch(`https://docs.google.com/spreadsheets/d/${a.sheet}/gviz/tq?tqx=out:csv&gid=${a.gid}&_=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    const rows = parseCSV(await r.text());
    const cab = rows[0].map(h => h.trim().toLowerCase());
    const iSetor = cab.indexOf('setor'), iStatus = cab.indexOf('status');
    if (iSetor < 0 || iStatus < 0) throw new Error('colunas não encontradas');
    const linhas = rows.slice(1).filter(r => (r[iSetor] || '').trim());
    const conc = linhas.filter(r => /^(sim|true|1|x|verdadeiro)$/i.test((r[iStatus] || '').trim())).length;
    return { total: linhas.length, conc };
}

async function carregar() {
    const btn = $('btn-atualizar'); btn.disabled = true;
    $('sync').textContent = 'Lendo as planilhas…';
    let falhas = [];
    for (const [k, a] of Object.entries(AGENCIAS)) {
        try { dados[k] = await lerPlanilha(a); } catch (e) { falhas.push(a.nome); }
    }
    try { localStorage.setItem(STORE_DADOS, JSON.stringify(dados)); } catch (e) {}
    Object.keys(AGENCIAS).forEach(calcular);
    const hora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    if (!falhas.length) $('sync').textContent = 'Planilhas lidas às ' + hora;
    else $('sync').textContent = `Não foi possível ler a planilha de ${falhas.join(' e ')}${Object.keys(dados).length ? ' (mostrando a última leitura salva)' : ''}. Ela precisa estar compartilhada como "Qualquer pessoa com o link".`;
    btn.disabled = false;
}

$('btn-atualizar').addEventListener('click', carregar);
Object.keys(AGENCIAS).forEach(calcular); // mostra a última leitura salva enquanto carrega
carregar();
</script>
</body>
</html>
