.dias button.on{background:#1d4e89;color:#fff}
.dias button.zero b{color:#b00020}

.hint{margin:0 0 8px;color:#555;font-size:1rem;min-height:1.2em}
table{border-collapse:collapse;margin:0;width:auto;font-size:14px}

const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const fone=v=>{const d=String(v||"").replace(/\D/g,"").slice(0,11);if(!d)return"";let t="("+d.slice(0,2);if(d.length>2)t+=") "+d.slice(2,7);if(d.length>7)t+="-"+d.slice(7);return t};
const sz=v=>Math.max(8,String(v||"").length+1);
const ordem=l=>[...l].sort((x,y)=>DIAS.indexOf(x)-DIAS.indexOf(y));
const st=t=>$("st").textContent=t;
const normaliza=l=>{const r=(Array.isArray(l)?l:[]).map(a=>({id:a.id||uid(),ag:a.ag==="ABT"?"ABT":"AJA",nome:a.nome||"",email:a.email||"",contato:fone(a.contato),siape:String(a.siape||""),dias:ordem(Array.isArray(a.dias)?a.dias:(a.dia?[a.dia]:[])),cor:/^#[0-9a-f]{6}$/i.test(a.cor||"")?a.cor.toLowerCase():"",...(a.ferias===true?{ferias:true}:{})}));
  const us=new Set(r.map(x=>x.cor).filter(Boolean));r.forEach((x,i)=>{if(!x.cor){const c=corLivre(us);x.cor=c;us.add(c)}});return r};
const hsl2hex=(h,s,l)=>{s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return"#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("")};
const corLivre=us=>{const c=PAL.find(p=>!us.has(p));if(c)return c;for(let i=0;i<720;i++){const x=hsl2hex((i*137.5)%360,60,45);if(!us.has(x))return x}return PAL[0]};
const corNova=()=>corLivre(new Set(apms.map(a=>a.cor)));
function semente(){try{const l=JSON.parse(localStorage.getItem("escala_v3"));if(Array.isArray(l)&&l.length)return normaliza(l)}catch(e){}return normaliza(SEED.map(r=>P(...r)))}

/* Dados no Supabase */
async function carregar(){
  const{data,error}=await sb.from("escala").select("dados,atualizado_em,atualizado_por").eq("id",1).maybeSingle();
  if(error){st("Erro ao carregar");return}
  if(data){apms=normaliza(data.dados);versao=data.atualizado_em;meta=data}else{apms=[];versao=null;meta={}}
  render();
}
async function _salvar(){
  if(!podeEditar)return false;
  st("Salvando…");
  const linha={dados:apms,atualizado_em:new Date().toISOString(),atualizado_por:usuario},sel="atualizado_em,atualizado_por";
  const r=versao===null?await sb.from("escala").insert({id:1,...linha}).select(sel)
    :await sb.from("escala").update(linha).eq("id",1).eq("atualizado_em",versao).select(sel);
  if(r.error||!r.data||!r.data.length){
    alert(r.error?"Não foi possível salvar: "+r.error.message:"Outra pessoa alterou a escala enquanto você editava. Vou recarregar a versão mais recente; refaça a sua alteração.");
    editId=null;await carregar();st("");return false;
  }
  versao=r.data[0].atualizado_em;meta=r.data[0];st("Salvo");setTimeout(()=>st(""),1500);return true;
}
const salvar=()=>fila=fila.then(_salvar);

/* Filtros, ordenação e tela */
function ordenados(l){
  const c=ord.c||"nome",v=a=>norm(a[c]);
  return [...l].sort((x,y)=>{const A=v(x),B=v(y);let r=A<B?-1:A>B?1:0;if(ord.c)r*=ord.d;return r||x.nome.localeCompare(y.nome,"pt")});
}
function render(){
  const ag=agAberta,L=ag?ordenados(apms.filter(a=>a.ag===ag)):[];
  const linha=a=>{
    const ed=a.id===editId;
    const cell=(f,v)=>ed?`<input data-f="${f}" size="${sz(v)}" value="${esc(v)}">`:esc(v);
    return`<tr class="${a.ag}${ed?" ed":""}" data-id="${a.id}">
<td>${ed?`${cell("nome",a.nome)}<br><label class="cf">Agência <select data-f="ag" style="margin:0;width:auto">${opts(["AJA","ABT"],a.ag)}</select></label> <label class="cf">Cor de fundo <input type="color" data-f="cor" value="${a.cor}"></label>`:`<span class="sw" style="background:${a.cor}"></span>${esc(a.nome)}${a.ferias?'<span class="tag fer">🌴 Férias</span>':""}`}</td><td>${cell("email",a.email)}</td><td>${ed?`<input data-f="contato" inputmode="tel" maxlength="15" size="16" placeholder="(##) #####-####" value="${esc(a.contato)}">`:esc(a.contato)}</td><td>${cell("siape",a.siape)}</td></tr>`};
  const cont=g=>{const t=apms.filter(a=>a.ag===g).length;return t+(t===1?" servidor":" servidores")};
  $("qtABT").textContent=cont("ABT");$("qtAJA").textContent=cont("AJA");
  $("ov").hidden=!ag;
  if(ag){$("mt").textContent="IBGE - "+ag;$("mq").textContent=cont(ag);
    $("tbM").innerHTML=L.length?L.map(linha).join(""):`<tr><td colspan="4">Nenhum servidor cadastrado na ${ag}.</td></tr>`}
  $("dias").innerHTML=DIAS.map(d=>{const n=apms.filter(a=>a.dias.includes(d)).length;
    return`<button data-d="${d}" class="${filtroDia===d?"on":""}${n?"":" zero"}" title="Destacar a coluna deste dia">${d.split("-")[0]} <b>${n}</b></button>`}).join("");
  document.querySelectorAll("th.s").forEach(th=>th.textContent=th.dataset.l+(ord.c===th.dataset.c?(ord.d>0?" ▲":" ▼"):""));
  const a=apms.find(x=>x.id===editId);
  $("ht").textContent=$("mdica").textContent=a?`Editando ${a.nome||"novo servidor"}. Clique fora da linha ou pressione Esc para concluir.`
    :modoLocal?"Modo local sem login: somente leitura."
    :podeEditar?"Clique com o botão direito do mouse para editar."
    :"Somente leitura: sua conta não tem permissão para editar a escala.";
  render2();ajusta();
}
/* Tabela visível: quadro semanal com o nome e a agência de cada servidor. Os dados completos ficam nos quadros ABT/AJA */
const porAg=l=>[...l].sort((x,y)=>x.ag.localeCompare(y.ag)||x.nome.localeCompare(y.nome,"pt"));
function render2(){
  const A=porAg(apms),col=DIAS.map(d=>A.filter(a=>a.dias.includes(d)));
  const n=Math.max(8,...col.map(c=>c.length));
  $("h2").innerHTML=DIAS.map(d=>`<th${filtroDia===d?' class="fd"':""}>${d}</th>`).join("");
  let h="";
  for(let i=0;i<n;i++)h+="<tr>"+DIAS.map((d,j)=>{const a=col[j][i];
    return`<td data-d="${d}" data-i="${i}"${a?` data-id="${a.id}"`:""} class="${a?"f ":""}${a&&a.ferias?"fer ":""}${filtroDia===d?"fd":""}"${a?` style="background:${a.cor};color:${txt(a.cor)}"`:""}>${a?`<div class="cn"><span class="nm">${esc(a.nome||"(sem nome)")}</span><span class="tags">${a.ferias?'<span class="tag fer">🌴 Férias</span>':""}<span class="tag ${a.ag}">${a.ag}</span></span></div>`:""}</td>`}).join("")+"</tr>";
  $("tb2").innerHTML=h;
}
/* Transforma a célula da tabela superior numa lista com todos os servidores */
function escolher(td){
  const d=td.dataset.d,atual=td.dataset.id||"";
  const op=porAg(apms).filter(a=>a.id===atual||!a.dias.includes(d));
  td.innerHTML=`<select class="pick" data-d="${d}" data-old="${atual}"><option value="">${atual?"(remover deste dia)":"— escolher servidor —"}</option>${op.map(a=>`<option value="${a.id}"${a.id===atual?" selected":""}>${esc(a.nome||"(sem nome)")} (${a.ag})${a.ferias?" – férias":""}</option>`).join("")}</select>`;
  const sl=td.firstChild;sl.focus();try{sl.showPicker()}catch(e){}
}
$("tb2").addEventListener("change",async e=>{
  const sl=e.target;if(!sl.classList.contains("pick"))return;
  const d=sl.dataset.d,old=sl.dataset.old,nv=sl.value;
  if(nv===old){render2();return}
  const ao=apms.find(a=>a.id===old),an=apms.find(a=>a.id===nv);
  if(ao)ao.dias=ao.dias.filter(x=>x!==d);
  if(an&&!an.dias.includes(d))an.dias=ordem([...an.dias,d]);
  await salvar();render();
});
$("tb2").addEventListener("focusout",e=>{const sl=e.target;if(sl.classList&&sl.classList.contains("pick")&&sl.value===sl.dataset.old)render2()});
/* Tabela superior com tamanho fixo: cabeçalho + 8 linhas (acima disso, rola por dentro) */
function ajusta(){
  const w=$("w2"),r=$("tb2").rows[0];if(!r)return;
  w.style.height=($("t2").tHead.offsetHeight+r.offsetHeight*8+1)+"px";
}
addEventListener("resize",ajusta);
$("dias").onclick=e=>{const b=e.target.closest("button");if(!b)return;filtroDia=filtroDia===b.dataset.d?"":b.dataset.d;render()};
tb.addEventListener("click",e=>{const th=e.target.closest("th.s");if(!th)return;const c=th.dataset.c;
  if(ord.c!==c)ord={c,d:1};else if(ord.d===1)ord.d=-1;else ord={c:"",d:1};render()});

/* Edição (só pelo botão direito, só para editores) */
async function endEdit(){
  if(!editId)return;
  const a=apms.find(x=>x.id===editId),id=editId;editId=null;
  if(a&&!a.nome&&!a.email&&!a.contato&&!a.siape){apms=apms.filter(x=>x!==a);if(!novos.has(id))await salvar()}
  novos.delete(id);render();
}
function abrir(id){const a=apms.find(x=>x.id===id);if(a)agAberta=a.ag;editId=id;render();const i=tb.querySelector("tr.ed input[data-f=nome]");if(i)i.focus()}
const find=el=>apms.find(a=>a.id===el.closest("tr").dataset.id);
tb.addEventListener("input",e=>{const t=e.target;if(t.tagName!=="INPUT"||t.type==="color")return;if(t.dataset.f==="contato"){t.value=fone(t.value);return}t.size=sz(t.value)});
tb.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.target.blur();endEdit()}});
tb.addEventListener("change",async e=>{
  const f=e.target.dataset.f;if(!f)return;const a=find(e.target),v=e.target.value;
  if(f==="contato"){const d=v.replace(/\D/g,"");if(d.length&&d.length!==11){alert("Informe o telefone completo no formato (##) #####-####, somente números.");e.target.value=a.contato;return}a.contato=fone(v)}
  else if(f==="cor"){const c=v.toLowerCase(),dup=apms.find(x=>x!==a&&x.cor===c);if(dup){alert("Essa cor já é usada por "+(dup.nome||"outro servidor")+". Escolha outra.");e.target.value=a.cor;return}a.cor=c}
  else a[f]=v.trim();
  if(await salvar())novos.delete(a.id);
  if(f==="ag"){const n=apms.find(x=>x.id===a.id);if(n)agAberta=n.ag;render()}else{render2();ajusta()}
});
/* Quadros ABT / AJA: ocultos até clicar no botão da agência */
let btnOrigem=null;
function abreModal(ag,btn){btnOrigem=btn||btnOrigem;agAberta=ag;render();$("modal").focus()}
async function fecharModal(){
  await endEdit();agAberta=null;render();
  if(btnOrigem){btnOrigem.focus();btnOrigem=null}
}
$("bABT").onclick=e=>abreModal("ABT",e.currentTarget);
$("bAJA").onclick=e=>abreModal("AJA",e.currentTarget);
$("mx").onclick=fecharModal;
$("ov").addEventListener("mousedown",e=>{if(e.target===$("ov"))fecharModal()});

/* Incluir servidor pela tabela visível: nome + agência (o dia vem da célula clicada) */
const ovAdd=$("ovAdd"),addErr=m=>{$("addErr").textContent=m||""};
function abreAdd(d){addD=d;$("addDia").value=d;$("addNome").value="";$("addAg").value="";addErr("");ovAdd.hidden=false;$("addNome").focus()}
function fechaAdd(){ovAdd.hidden=true;addD=""}
async function incluir(){
  const nome=$("addNome").value.trim().replace(/\s+/g," "),ag=$("addAg").value;
  if(!nome){addErr("Informe o nome do servidor.");return}
  if(!ag){addErr("Selecione a agência (ABT ou AJA).");return}
  $("addOk").disabled=true;
  await endEdit();await carregar();
  const dup=apms.find(a=>norm(a.nome)===norm(nome));
  if(dup){$("addOk").disabled=false;addErr(`Já existe "${dup.nome}" (${dup.ag}). Use "Escolher servidor para ${addD}" no menu do botão direito.`);return}
  apms.push({id:uid(),ag,nome,email:"",contato:"",siape:"",dias:[addD],cor:corNova()});
  await salvar();render();
  $("addOk").disabled=false;fechaAdd();
}
$("addOk").onclick=incluir;$("addCan").onclick=fechaAdd;$("addX").onclick=fechaAdd;
ovAdd.addEventListener("mousedown",e=>{if(e.target===ovAdd)fechaAdd()});
ovAdd.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName!=="BUTTON"){e.preventDefault();incluir()}});

/* Menu do botão direito: tabela visível e quadros ABT/AJA (só para editores) */
document.addEventListener("contextmenu",e=>{
  if(!podeEditar)return;
  const cel=e.target.closest("#t2 td[data-d]"),lin=e.target.closest("#baixo tr[data-id]"),mod=e.target.closest("#modal");
  if(!cel&&!mod)return;
  e.preventDefault();
  let h="",id="";
  if(cel){
    id=cel.dataset.id||"";const d=cel.dataset.d;
    h=`<button data-act="pick" data-d="${d}" data-i="${cel.dataset.i}">Escolher servidor para ${d}</button><button data-act="addnew" data-d="${d}">Adicionar servidor em ${d}</button>`+(id?`<button class="d" data-act="rmdia" data-id="${id}" data-d="${d}">Remover da ${d}</button>`:"");
  }else id=lin?lin.dataset.id:"";
  if(id){const f=apms.find(x=>x.id===id);h+=`<button data-act="ferias" data-id="${id}" data-v="${f&&f.ferias?0:1}">${f&&f.ferias?"Remover férias":"Marcar férias"}</button>`}
  if(id)h+=`<button data-act="edit" data-id="${id}">Editar servidor</button><button class="d" data-act="del" data-id="${id}">Excluir servidor</button>`;
  if(mod)h+=`<button data-act="add" data-ag="${agAberta}">Adicionar servidor na ${agAberta}</button>`;
  menu.innerHTML=h;
  menu.style.display="block";
  menu.style.left=Math.min(e.clientX,innerWidth-menu.offsetWidth-8)+"px";
  menu.style.top=Math.min(e.clientY,innerHeight-menu.offsetHeight-8)+"px";
});
menu.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;menu.style.display="none";
  await endEdit();
  if(act==="addnew"){abreAdd(b.dataset.d);return}
  await carregar();
  if(act==="edit"){if(apms.some(x=>x.id===id))abrir(id)}
  else if(act==="del"){const a=apms.find(x=>x.id===id);
    if(a&&confirm("Excluir "+(a.nome||"este servidor")+" da escala?")){apms=apms.filter(x=>x!==a);await salvar();render()}}
  else if(act==="ferias"){const a=apms.find(x=>x.id===id);
    if(a){if(b.dataset.v==="1")a.ferias=true;else delete a.ferias;await salvar();render()}}
  else if(act==="rmdia"){const a=apms.find(x=>x.id===id),d=b.dataset.d;
    if(a&&d){a.dias=a.dias.filter(x=>x!==d);await salvar();render()}}
  else if(act==="pick"){const td=$("tb2").querySelector(`td[data-d="${b.dataset.d}"][data-i="${b.dataset.i}"]`);if(td)escolher(td)}
  else if(act==="add"){const n={id:uid(),ag:b.dataset.ag==="ABT"?"ABT":"AJA",nome:"",email:"",contato:"",siape:"",dias:[],cor:corNova()};apms.push(n);novos.add(n.id);abrir(n.id)}
});
document.addEventListener("click",e=>{
  if(!e.target.closest("#menu"))menu.style.display="none";
  if(editId&&!e.target.closest("tr.ed")&&!e.target.closest("#menu"))endEdit();
});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;
  if(!ovAdd.hidden){fechaAdd();return}
  if(menu.style.display==="block"){menu.style.display="none";return}
  if(editId){endEdit();return}
  if(agAberta){fecharModal();return}
  render2();
});
addEventListener("scroll",()=>menu.style.display="none",true);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!editId&&!modoLocal)carregar()});

/* Voltar: retorna à página que já estava aberta (não abre outra cópia) */
$("voltar").addEventListener("click",e=>{
  e.preventDefault();
  if(history.length>1){history.back();return}
  window.close();
  setTimeout(()=>{let r="";try{const u=new URL(document.referrer);if(u.origin===location.origin)r=u.href}catch(_){}location.href=r||"index.html"},400);
});

/* Início: login obrigatório, permissões e dados */
(async()=>{
  const liberar=()=>{const g=$("guarda-css");if(g)g.remove()};
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(!session){
      if(noGit)return location.replace("index.html");
      modoLocal=true;apms=semente();liberar();render();return;
    }
    const{data:p}=await sb.from("perfis").select("aprovado").eq("id",session.user.id).maybeSingle();
    if(!p||p.aprovado!==true)return location.replace("index.html");
    usuario=session.user.email||"";
    const{data:ed}=await sb.from("escala_editores").select("email").maybeSingle();
    podeEditar=!!ed;
    await carregar();
    if(versao===null&&podeEditar){apms=semente();await salvar()}
    liberar();render();
  }catch(e){liberar();st("Erro de conexão");render()}
})();
</script>
</body>
