<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escala de Servidores</title>
<style id="guarda-css">html{visibility:hidden}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font:14px "Segoe UI",Arial,sans-serif;margin:0;padding:20px;min-height:100vh;box-sizing:border-box;color:#111;text-align:center;
  display:flex;justify-content:center;align-items:center;
  background-color:#e6ecf3;
  background-image:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)),url('background.png');
  background-size:100% 100%;background-position:center;background-repeat:no-repeat;background-attachment:fixed}
.painel{background:rgba(255,255,255,.95);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.4);padding:22px;width:fit-content;max-width:100%;min-width:0;margin:0 auto}
button{font:inherit;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:10px}
.bar input,.bar select{padding:6px 8px;border:1px solid #888;border-radius:3px;font:inherit}
.btn{padding:7px 14px;border:1px solid #888;background:#f2f2f2;border-radius:3px}
.btn:hover{background:#e6e6e6}
#st{color:#1d4e89;font-weight:600}
a.btn{color:inherit;text-decoration:none;display:inline-block}
.dias{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.dias button{border:1px solid #1d4e89;background:#fff;color:#1d4e89;border-radius:99px;padding:3px 12px;text-transform:capitalize}
.dias button.on{background:#1d4e89;color:#fff}
.dias button.zero b{color:#b00020}
.dias button.on.zero b{color:#ffd0d6}
.hint{margin:0 0 12px;color:#555;font-size:.88rem;min-height:1.2em}
.wrap{overflow-x:auto}
table{border-collapse:collapse;margin:0 auto;width:auto;font-size:14px}
th,td{border:1px solid #222;padding:4px 10px;vertical-align:middle;white-space:nowrap;text-align:center}
th{background:#0b2545;color:#fff;font-weight:700;padding:7px 10px;border-color:#0b2545}
th.s{cursor:pointer;user-select:none}
th.s:hover{background:#13315c}
th.titulo{background:#1d4e89;border-color:#1d4e89;padding:20px 12px;cursor:default}
.t1{font-size:1.6rem;font-weight:700}
.t2{font-size:.95rem;font-weight:600;letter-spacing:.15em;margin-top:4px}
tr.AJA td{background:#eaf3fc}
tr.ABT td{background:#fdf1dc}
tr.ed td{background:#fff9c4}
tbody tr:hover td{filter:brightness(.96)}
td:nth-child(2),td:nth-child(3){text-align:left}
td input,td select{font:inherit;border:1px solid #999;border-radius:3px;background:#fff;padding:3px 4px;text-align:center;width:auto}
td:nth-child(2) input,td:nth-child(3) input{text-align:left}
td select{width:100%;color:#555;margin-top:3px}
td input:focus,td select:focus{outline:2px solid #1d4e89}
.b{display:flex;justify-content:center;align-items:center;gap:6px;padding:1px 2px}
.b button{border:0;background:none;color:#b00020;font-size:1rem;line-height:1;padding:0 4px}
.rod{margin:10px 0 0;font-size:.85rem;color:#555}
#menu{position:fixed;display:none;z-index:50;background:#fff;border:1px solid #999;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:4px;min-width:180px;text-align:left}
#menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:4px}
#menu button:hover{background:#e8eef7}
#menu button.d{color:#b00020}
@page{size:A4 landscape;margin:10mm}
@media print{
  body{display:block;padding:0;min-height:0;background:none!important}
  .painel{background:none;box-shadow:none;padding:0;width:auto}
  .bar,.dias,.hint,#menu{display:none!important}
  .wrap{overflow:visible}
  table{zoom:.85}
  tbody tr:hover td{filter:none}
}
</style>
</head>
<body>
<div class="painel">
<div class="bar">
  <a class="btn" href="index.html">← Voltar</a>
  <select id="fag"><option value="">Todas as agências</option><option>AJA</option><option>ABT</option></select>
  <button class="btn" id="xls">Salvar em planilha</button>
  <button class="btn" id="pdf">Salvar em PDF</button>
</div>
<div class="dias" id="dias"></div>
<p class="hint"><span id="ht"></span> <span id="st"></span></p>
<div class="wrap">
<table>
<thead>
<tr><th colspan="5" class="titulo"><div class="t1">Escala de Servidores</div><div class="t2">BASE TERRITORIAL</div></th></tr>
<tr><th class="s" data-c="ag" data-l="Agência">Agência</th><th class="s" data-c="nome" data-l="APM">APM</th><th class="s" data-c="email" data-l="e-mail">e-mail</th><th class="s" data-c="siape" data-l="SIAPE">SIAPE</th><th class="s" data-c="dias" data-l="Dia Agência">Dia Agência</th></tr>
</thead>
<tbody id="tb"></tbody>
</table>
</div>
<p class="rod" id="rod"></p>
</div>
<div id="menu"></div>

<script>
const sb=supabase.createClient('https://rdxklpkukmuwwetftqde.supabase.co','sb_publishable_sklR4egsYWIHZ3UMdWLyWQ_NHOVkD16');
const noGit=location.hostname.endsWith("github.io");
const DIAS=["segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira"];
const uid=()=>Math.random().toString(36).slice(2);
const P=(ag,nome,email,siape,dia)=>({id:uid(),ag,nome,email,siape,dias:[dia]});
const SEED=[
["AJA","Adriana Costa Braz dos Santos","adriana.braz@ibge.gov.br","3471919","terça-feira"],
["AJA","Arthur Louzada de Souza","arthur.souza@ibge.gov.br","3476717","quarta-feira"],
["AJA","Fabio Pereira Silva","fabio.pereira@ibge.gov.br","3451876","quarta-feira"],
["AJA","Gabriel Finotti dos Reis Nunes","gabriel-finotti.reis@ibge.gov.br","3373216","sexta-feira"],
["AJA","Hugo de Mello Sampaio","hugo.mello@ibge.gov.br","3476720","segunda-feira"],
["AJA","Iuri George da Silva Palmeira","iuri.palmeira@ibge.gov.br","2157841","sexta-feira"],
["AJA","Lucas Mucuri Ramos","lucas.mucuri@ibge.gov.br","3469134","sexta-feira"],
["AJA","Maury Fadel Goncalves","maury.goncalves@ibge.gov.br","3408075","segunda-feira"],
["AJA","Paulo Felipe Ferreira Tavares","paulo-felipe.tavares@ibge.gov.br","3495437","quinta-feira"],
["AJA","Romenig Oliveira Candido","romenig.candido@ibge.gov.br","3392136","quarta-feira"],
["ABT","Guilherme Silva Xavier de Souza","guilherme.xavier@ibge.gov.br","1100687","terça-feira"],
["ABT","Icaro Leandro Costa dos Santos Teixeira","icaro.teixeira@ibge.gov.br","3452834","terça-feira"],
["ABT","Joao Gabriel Martins da Cruz Moraes","joao.moraes@ibge.gov.br","3505895","terça-feira"]];

let apms=[],editId=null,podeEditar=false,modoLocal=false,versao=null,meta={},usuario="",filtroDia="",ord={c:"",d:1},fila=Promise.resolve();
const novos=new Set();
const $=id=>document.getElementById(id),tb=$("tb"),menu=$("menu");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opts=(arr,cur)=>arr.map(v=>`<option${v===cur?" selected":""}>${esc(v)}</option>`).join("");
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const sz=v=>Math.max(8,String(v||"").length+1);
const ordem=l=>[...l].sort((x,y)=>DIAS.indexOf(x)-DIAS.indexOf(y));
const st=t=>$("st").textContent=t;
const normaliza=l=>(Array.isArray(l)?l:[]).map(a=>({id:a.id||uid(),ag:a.ag==="ABT"?"ABT":"AJA",nome:a.nome||"",email:a.email||"",siape:String(a.siape||""),dias:ordem(Array.isArray(a.dias)?a.dias:(a.dia?[a.dia]:[]))}));
function semente(){try{const l=JSON.parse(localStorage.getItem("escala_v3"));if(Array.isArray(l)&&l.length)return normaliza(l)}catch(e){}return normaliza(SEED.map(r=>P(...r)))}

/* Dados no Supabase */
async function carregar(){
  const{data,error}=await sb.from("escala").select("dados,atualizado_em,atualizado_por").eq("id",1).maybeSingle();
  if(error){st("Erro ao carregar");return}
  if(data){apms=normaliza(data.dados);versao=data.atualizado_em;meta=data}else{apms=[];versao=null;meta={}}
  render();
}
async function _salvar(){
  if(!podeEditar)return false;
  st("Salvando…");
  const linha={dados:apms,atualizado_em:new Date().toISOString(),atualizado_por:usuario},sel="atualizado_em,atualizado_por";
  const r=versao===null?await sb.from("escala").insert({id:1,...linha}).select(sel)
    :await sb.from("escala").update(linha).eq("id",1).eq("atualizado_em",versao).select(sel);
  if(r.error||!r.data||!r.data.length){
    alert(r.error?"Não foi possível salvar: "+r.error.message:"Outra pessoa alterou a escala enquanto você editava. Vou recarregar a versão mais recente; refaça a sua alteração.");
    editId=null;await carregar();st("");return false;
  }
  versao=r.data[0].atualizado_em;meta=r.data[0];st("Salvo");setTimeout(()=>st(""),1500);return true;
}
const salvar=()=>fila=fila.then(_salvar);

/* Filtros, ordenação e tela */
function filtrados(comDia){
  const fa=$("fag").value;
  return apms.filter(a=>a.id===editId||((!fa||a.ag===fa)&&(!comDia||!filtroDia||a.dias.includes(filtroDia))));
}
function ordenados(l){
  const c=ord.c||"ag",v=a=>c==="dias"?(a.dias.length?DIAS.indexOf(a.dias[0]):9):norm(a[c]);
  return [...l].sort((x,y)=>{const A=v(x),B=v(y);let r=A<B?-1:A>B?1:0;if(ord.c)r*=ord.d;return r||x.nome.localeCompare(y.nome,"pt")});
}
function quando(){
  if(!meta.atualizado_em)return"";
  const d=new Date(meta.atualizado_em);
  return`Atualizado em ${d.toLocaleDateString("pt-BR")} às ${d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`+(meta.atualizado_por?` por ${meta.atualizado_por}`:"");
}
function render(){
  const L=ordenados(filtrados(true));
  tb.innerHTML=L.length?L.map(a=>{
    const ed=a.id===editId,dl=DIAS.filter(d=>!a.dias.includes(d));
    const cell=(f,v)=>ed?`<input data-f="${f}" size="${sz(v)}" value="${esc(v)}">`:esc(v);
    const dias=a.dias.map(d=>`<div class="b"><span>${d}</span>${ed?`<button title="Remover dia" data-rmd="${d}">×</button>`:""}</div>`).join("");
    return`<tr class="${a.ag}${ed?" ed":""}" data-id="${a.id}">
<td>${ed?`<select data-f="ag" style="margin:0">${opts(["AJA","ABT"],a.ag)}</select>`:esc(a.ag)}</td>
<td>${cell("nome",a.nome)}</td><td>${cell("email",a.email)}</td><td>${cell("siape",a.siape)}</td>
<td>${dias}${ed&&dl.length?`<select data-f="addd"><option value="">+ adicionar dia</option>${opts(dl)}</select>`:""}</td></tr>`}).join("")
    :`<tr><td colspan="5">Nenhum servidor encontrado.</td></tr>`;
  const base=filtrados(false);
  $("dias").innerHTML=DIAS.map(d=>{const n=base.filter(a=>a.dias.includes(d)).length;
    return`<button data-d="${d}" class="${filtroDia===d?"on":""}${n?"":" zero"}" title="Filtrar por este dia">${d.split("-")[0]} <b>${n}</b></button>`}).join("");
  document.querySelectorAll("th.s").forEach(th=>th.textContent=th.dataset.l+(ord.c===th.dataset.c?(ord.d>0?" ▲":" ▼"):""));
  $("rod").textContent=quando();
  const a=apms.find(x=>x.id===editId);
  $("ht").textContent=a?`Editando ${a.nome||"novo servidor"}. Clique fora da linha ou pressione Esc para concluir.`
    :modoLocal?"Modo local sem login: somente leitura."
    :podeEditar?"Tabela travada. Clique com o botão direito do mouse para editar, excluir ou adicionar servidores."
    :"Somente leitura: sua conta não tem permissão para editar a escala.";
}
$("fag").onchange=render;
$("dias").onclick=e=>{const b=e.target.closest("button");if(!b)return;filtroDia=filtroDia===b.dataset.d?"":b.dataset.d;render()};
document.querySelector("thead").onclick=e=>{const c=e.target.dataset.c;if(!c)return;
  if(ord.c!==c)ord={c,d:1};else if(ord.d===1)ord.d=-1;else ord={c:"",d:1};render()};

/* Edição (só pelo botão direito, só para editores) */
async function endEdit(){
  if(!editId)return;
  const a=apms.find(x=>x.id===editId),id=editId;editId=null;
  if(a&&!a.nome&&!a.email&&!a.siape){apms=apms.filter(x=>x!==a);if(!novos.has(id))await salvar()}
  novos.delete(id);render();
}
function abrir(id){editId=id;render();const i=tb.querySelector("tr.ed input[data-f=nome]");if(i)i.focus()}
const find=el=>apms.find(a=>a.id===el.closest("tr").dataset.id);
tb.addEventListener("input",e=>{if(e.target.tagName==="INPUT")e.target.size=sz(e.target.value)});
tb.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.target.blur();endEdit()}});
tb.addEventListener("change",async e=>{
  const f=e.target.dataset.f;if(!f)return;const a=find(e.target),v=e.target.value;
  if(f==="addd"){if(v&&!a.dias.includes(v))a.dias=ordem([...a.dias,v])}else a[f]=v.trim();
  if(await salvar())novos.delete(a.id);
  if(f==="addd"||f==="ag")render();
});
tb.addEventListener("click",async e=>{
  const t=e.target;if(!(t instanceof HTMLButtonElement)||t.dataset.rmd===undefined)return;
  const a=find(t);a.dias=a.dias.filter(d=>d!==t.dataset.rmd);await salvar();render();
});
document.querySelector(".wrap").addEventListener("contextmenu",e=>{
  if(!podeEditar)return;
  e.preventDefault();
  const row=e.target.closest("tr[data-id]"),id=row?row.dataset.id:"";
  menu.innerHTML=(row?`<button data-act="edit" data-id="${id}">Editar servidor</button><button class="d" data-act="del" data-id="${id}">Excluir servidor</button>`:"")+`<button data-act="add">Adicionar APM</button>`;
  menu.style.display="block";
  menu.style.left=Math.min(e.clientX,innerWidth-menu.offsetWidth-8)+"px";
  menu.style.top=Math.min(e.clientY,innerHeight-menu.offsetHeight-8)+"px";
});
menu.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;menu.style.display="none";
  await endEdit();await carregar();
  if(act==="edit"){if(apms.some(x=>x.id===id))abrir(id)}
  else if(act==="del"){const a=apms.find(x=>x.id===id);
    if(a&&confirm("Excluir "+(a.nome||"este servidor")+" da escala?")){apms=apms.filter(x=>x!==a);await salvar();render()}}
  else if(act==="add"){const n={id:uid(),ag:"AJA",nome:"",email:"",siape:"",dias:[]};apms.push(n);novos.add(n.id);abrir(n.id)}
});
document.addEventListener("click",e=>{
  if(!e.target.closest("#menu"))menu.style.display="none";
  if(editId&&!e.target.closest("tr.ed")&&!e.target.closest("#menu"))endEdit();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){menu.style.display="none";endEdit()}});
addEventListener("scroll",()=>menu.style.display="none",true);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!editId&&!modoLocal)carregar()});

/* PDF e planilha */
$("pdf").onclick=async()=>{await endEdit();window.print()};
function baixar(conteudo,tipo,nome){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo}));a.download=nome;a.click();URL.revokeObjectURL(a.href)}
$("xls").onclick=async()=>{
  await endEdit();
  const cor={AJA:"#EAF3FC",ABT:"#FDF1DC"},br=l=>l.map(esc).join('<br style="mso-data-placement:same-cell">');
  const rows=ordenados(filtrados(true)).map(a=>{const s=`style="background:${cor[a.ag]}"`;
    return`<tr><td ${s}>${esc(a.ag)}</td><td ${s}>${esc(a.nome)}</td><td ${s}>${esc(a.email)}</td><td ${s}>${esc(a.siape)}</td><td ${s}>${br(a.dias)}</td></tr>`}).join("");
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>td,th{border:.5pt solid #222;text-align:center;vertical-align:middle;mso-number-format:"\\@"}</style></head><body><table>
<tr><th colspan="5" style="background:#1d4e89;color:#fff;font-size:18pt;height:40pt">Escala de Servidores</th></tr>
<tr><th colspan="5" style="background:#1d4e89;color:#fff;letter-spacing:2pt">BASE TERRITORIAL</th></tr>
<tr>${["Agência","APM","e-mail","SIAPE","Dia Agência"].map(h=>`<th style="background:#0b2545;color:#fff">${h}</th>`).join("")}</tr>${rows}
<tr><td colspan="5" style="border:0;text-align:right;font-size:9pt">${esc(quando())}</td></tr></table></body></html>`;
  baixar("\ufeff"+html,"application/vnd.ms-excel;charset=utf-8","escala-servidores.xls");
};

/* Início: login obrigatório, permissões e dados */
(async()=>{
  const liberar=()=>{const g=$("guarda-css");if(g)g.remove()};
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(!session){
      if(noGit)return location.replace("index.html");
      modoLocal=true;apms=semente();liberar();render();return;
    }
    const{data:p}=await sb.from("perfis").select("aprovado").eq("id",session.user.id).maybeSingle();
    if(!p||p.aprovado!==true)return location.replace("index.html");
    usuario=session.user.email||"";
    const{data:ed}=await sb.from("escala_editores").select("email").maybeSingle();
    podeEditar=!!ed;
    await carregar();
    if(versao===null&&podeEditar){apms=semente();await salvar()}
    liberar();render();
  }catch(e){liberar();st("Erro de conexão");render()}
})();
</script>
</body>
</html>
